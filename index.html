<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanjeevane | Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #3f3428;

            background:
                linear-gradient(
                    rgba(255, 250, 240, 0.88),
                    rgba(245, 238, 220, 0.92)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 65px 35px;
            background: rgba(255, 255, 255, 0.82);
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(80, 60, 30, 0.15);
        }

        .mantra {
            font-size: 18px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            color: #806b42;
        }

        .brand {
            font-size: 46px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #5d4326;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 19px;
            letter-spacing: 2px;
            color: #806b42;
            margin-bottom: 45px;
        }

        .coming {
            font-size: 48px;
            font-weight: normal;
            color: #795548;
            margin-bottom: 22px;
        }

        .message {
            max-width: 600px;
            margin: 0 auto 30px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 17px;
            line-height: 1.8;
            color: #655d54;
        }

        .contact {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            color: #6d593d;
            margin-top: 25px;
        }

        .contact strong {
            color: #4e3922;
        }

        .line {
            width: 80px;
            height: 2px;
            background: #b49a6a;
            margin: 25px auto;
        }

        footer {
            margin-top: 40px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 45px 22px;
            }

            .brand {
                font-size: 34px;
            }

            .coming {
                font-size: 38px;
            }

            .subtitle {
                font-size: 16px;
            }

            .mantra {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

       <div class="coming">
            Coming Soon
        </div>

        <p class="message">
            We are preparing something meaningful for you.
            Our website is currently under development and will be
            available soon.
        </p>

        <div class="contact">
            For enquiries, please contact<br><br>
            <strong>7842902829</strong>
        </div>

        <footer>
            &copy; 2026 Sanjeevane. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
